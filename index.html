<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eby Launchpad</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Launchpad">
<meta name="theme-color" content="#F2F6FB">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen app shell. Sticky top bar with kid + XP, scrolling content, fixed bottom tab bar. Big touch targets for iPad. */
:root{
  --bg:#F2F6FB; --panel:#FFFFFF; --panel-2:#E7EEF7; --ink:#152238; --muted:#5B6B82; --line:#D5DEEA;
  --accent:#FF7A1A; --accent-ink:#FFFFFF; --mint:#19B38A; --sky:#2F7BF5; --violet:#8A5CF6; --sun:#FFC43D; --storm:#5C6B8A; --danger:#E5484D;
  --kid:#2F7BF5;
  --display:"Fredoka","Nunito","Avenir Next",system-ui,sans-serif;
  --body:"Nunito","Avenir Next",system-ui,sans-serif;
  --r:18px; --shadow:0 6px 24px rgba(21,34,56,.08);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1626; --panel:#172338; --panel-2:#1F2E48; --ink:#F1F5FB; --muted:#9FB0C8; --line:#2B3B57;
  --accent:#FF8A33; --mint:#2BD3A3; --sky:#5B9BFF; --violet:#A98BFF; --sun:#FFD166; --storm:#8C9BB8; --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1626; --panel:#172338; --panel-2:#1F2E48; --ink:#F1F5FB; --muted:#9FB0C8; --line:#2B3B57;
  --accent:#FF8A33; --mint:#2BD3A3; --sky:#5B9BFF; --violet:#A98BFF; --sun:#FFD166; --storm:#8C9BB8; --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:30px}h2{font-size:23px}h3{font-size:18px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.app{display:flex;flex-direction:column;height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 8px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.main{flex:1;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 24px;-webkit-overflow-scrolling:touch}
.wrap{max-width:900px;margin:0 auto;display:grid;gap:16px}
.tabs{display:flex;justify-content:space-around;gap:4px;background:var(--panel);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:6px 6px}
.tab{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:14px;color:var(--muted);font-weight:800;font-size:12px;letter-spacing:.02em;text-transform:uppercase;min-height:56px}
.top .btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:520px){.tab{font-size:10px;padding:8px 2px;letter-spacing:0}.tab svg{width:22px;height:22px}}
.tab[aria-selected="true"]{color:var(--kid);background:color-mix(in srgb,var(--kid) 12%,transparent)}

.card{background:var(--panel);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.soft{background:var(--panel-2);box-shadow:none}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;font-family:var(--display);font-weight:600;font-size:17px;background:var(--panel-2);color:var(--ink);border:2px solid transparent}
.btn.primary{background:var(--kid);color:#fff}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:15px}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5}
.btn.block{width:100%}

.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;color:#fff;background:var(--kid);flex:none}
.avatar.lg{width:88px;height:88px;font-size:40px}
.kidbtn{display:grid;justify-items:center;gap:10px;padding:22px 12px;border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow);font-family:var(--display);font-size:22px;font-weight:600;border:3px solid transparent}
.kidbtn:active{transform:scale(.97)}

.xpbar{height:12px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--kid),var(--accent));border-radius:99px;transition:width .5s ease}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--panel-2);font-weight:800;font-size:13px;letter-spacing:.02em}
.pill.kid{background:color-mix(in srgb,var(--kid) 15%,transparent);color:var(--kid)}
.pill.mint{background:color-mix(in srgb,var(--mint) 18%,transparent);color:var(--mint)}
.pill.sun{background:color-mix(in srgb,var(--sun) 25%,transparent);color:#8a5a00}
:root[data-theme="dark"] .pill.sun{color:var(--sun)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .pill.sun{color:var(--sun)} }

/* Weather + thermometer */
.weather{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.wx{display:grid;justify-items:center;gap:6px;padding:12px 4px;border-radius:14px;background:var(--panel-2);font-weight:800;font-size:13px;border:3px solid transparent}
.wx svg{width:40px;height:40px}
.wx[aria-pressed="true"]{border-color:var(--kid);background:color-mix(in srgb,var(--kid) 12%,transparent)}
.thermo{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.deg{min-height:64px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-size:24px;font-weight:700;color:#fff;border:3px solid transparent;opacity:.55}
.deg[aria-pressed="true"]{opacity:1;border-color:var(--ink);transform:scale(1.04)}
.deg[data-n="1"]{background:#19B38A}.deg[data-n="2"]{background:#7FC24A}.deg[data-n="3"]{background:#FFC43D;color:#3b2a00}.deg[data-n="4"]{background:#FF8A33}.deg[data-n="5"]{background:#E5484D}

/* Habits */
.habit{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start;padding:14px;border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow)}
.check{width:56px;height:56px;border-radius:16px;border:3px solid var(--line);display:grid;place-items:center;background:var(--panel-2)}
.check svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.6);transition:all .2s}
.check[aria-pressed="true"]{background:var(--mint);border-color:var(--mint)}
.check[aria-pressed="true"] svg{opacity:1;transform:scale(1)}
.chain{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.chain i{width:16px;height:16px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line)}
.chain i.on{background:var(--mint);border-color:var(--mint)}
.chain i.today{outline:2px solid var(--kid);outline-offset:1px}
.habit .title{font-family:var(--display);font-size:19px;font-weight:600}
.habit .title.done{text-decoration:line-through;color:var(--muted)}

/* Forms */
label.f{display:grid;gap:6px;font-weight:800;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
input.t,textarea.t,select.t{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700;font-size:17px;text-transform:none;letter-spacing:0}
textarea.t{min-height:72px;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:99px;background:var(--panel-2);font-weight:800;font-size:14px;border:2px solid transparent;min-height:40px}
.chip[aria-pressed="true"]{border-color:var(--kid);color:var(--kid);background:color-mix(in srgb,var(--kid) 12%,transparent)}

/* SMART builder */
.smart{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start}
.smart .letter{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-family:var(--display);font-size:34px;font-weight:700;color:#fff;background:var(--kid)}
.smart .ex{font-size:14px;color:var(--muted);padding:8px 12px;border-radius:10px;background:var(--panel-2);margin-top:6px}
.goalcard{padding:16px;border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow);display:grid;gap:10px;border-left:8px solid var(--kid)}
.goalsentence{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.3}
.goalsentence b{color:var(--kid)}
.prog{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.prog button{min-height:44px;border-radius:12px;background:var(--panel-2);font-weight:800;border:2px solid transparent}
.prog button[aria-pressed="true"]{border-color:var(--kid);color:var(--kid);background:color-mix(in srgb,var(--kid) 12%,transparent)}
/* Chores + rewards */
.chore{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow)}
.chore .title{font-family:var(--display);font-size:18px;font-weight:600}
.chore .title.done{text-decoration:line-through;color:var(--muted)}
.coinpill{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:99px;background:color-mix(in srgb,var(--sun) 28%,transparent);color:#6b4600;font-family:var(--display);font-weight:600;font-size:16px;white-space:nowrap}
.coinpill svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .coinpill{color:var(--sun)} }
:root[data-theme="dark"] .coinpill{color:var(--sun)}
.reward{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--panel-2)}
.reward.cant{opacity:.6}
.walletbar{height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
/* Missions */
.mission{padding:16px;border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow);display:grid;gap:10px}
.steps{display:grid;gap:6px}
.step{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--panel-2);text-align:left;min-height:46px;width:100%}
.step .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--panel)}
.step.done .box{background:var(--mint);border-color:var(--mint)}
.step.done span{text-decoration:line-through;color:var(--muted)}
.step .box svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.timer{font-family:var(--display);font-size:64px;font-weight:700;text-align:center;letter-spacing:.02em}
.ring{width:200px;height:200px;margin:0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center}

/* Badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.badge{display:grid;justify-items:center;gap:6px;padding:12px 8px;border-radius:14px;background:var(--panel-2);text-align:center;font-weight:800;font-size:13px}
.badge .ico{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--muted)}
.badge.on .ico{background:var(--sun);color:#3b2a00}
.badge:not(.on){opacity:.55}
.badge svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* Coach game */
.critic{background:color-mix(in srgb,var(--storm) 18%,transparent);border-left:6px solid var(--storm);padding:14px 16px;border-radius:12px;font-family:var(--display);font-size:20px}
.coachopt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:14px;background:var(--panel-2);font-weight:700;border:3px solid transparent;min-height:56px}
.coachopt.picked{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 15%,transparent)}

/* Game cards */
.gamecard{padding:18px;border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow);display:grid;gap:10px;border-top:8px solid var(--kid)}
.bigword{font-family:var(--display);font-size:38px;font-weight:700;text-align:center;padding:20px;border-radius:14px;background:var(--panel-2)}

/* Toast + modal */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-family:var(--display);font-weight:600;font-size:18px;opacity:0;transition:all .25s;z-index:20;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(10,18,32,.55);display:grid;place-items:center;padding:16px;z-index:30}
.modal .card{width:100%;max-width:520px;max-height:90vh;overflow:auto}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pinpad button{min-height:60px;border-radius:14px;background:var(--panel-2);font-family:var(--display);font-size:26px;font-weight:600}
.dots{display:flex;gap:12px;justify-content:center;margin:8px 0 16px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--kid);border-color:var(--kid)}

.hero{display:grid;gap:14px;padding:22px;border-radius:24px;color:#fff;background:linear-gradient(135deg,var(--kid),color-mix(in srgb,var(--kid) 55%,#000 10%));box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero .pill{background:rgba(255,255,255,.2);color:#fff}
.hero .xpbar{background:rgba(255,255,255,.25)}
.hero .xpbar>i{background:#fff}
.stars{position:absolute;inset:0;pointer-events:none;opacity:.35}
.celebrate{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tablewrap{overflow-x:auto}
details summary{cursor:pointer;font-weight:800;list-style:none;display:flex;align-items:center;gap:8px;min-height:44px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"";width:10px;height:10px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(-45deg);transition:transform .2s}
details[open] summary::before{transform:rotate(45deg)}
.tip{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:12px;border-radius:14px;background:var(--panel-2)}
.tip .n{width:44px;height:44px;border-radius:12px;background:var(--kid);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px}
.gate{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.gate .card{width:100%;max-width:440px}
.code{font-family:var(--display);font-size:34px;letter-spacing:.18em;text-align:center;text-transform:uppercase}
.err{color:var(--danger);font-weight:700;font-size:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="fresh.js"></script>
<script>
(function(){
"use strict";
/* ---------- data ---------- */
const KEY="eby-launchpad-v1";
const KIDS={
  kellan:{name:"Kellan",color:"#2F7BF5",age:11},

};
const LEVELS=[[0,"Cadet"],[150,"Explorer"],[400,"Pilot"],[800,"Navigator"],[1400,"Commander"],[2200,"Captain"],[3200,"Admiral"],[4500,"Legend"]];
const XP={aboutme:30,goalset:15,goal:100,checkinGoal:15,goalstep:10,checkin:10,habit:5,journal:20,sprint:25,step:10,mission:100,coach:10,game:5};
const STARTER_HABITS={
  kellan:[{name:"Read 20 minutes",cue:"After I finish homework",identity:"someone who loves to learn"},{name:"Make my bed",cue:"After I get up",identity:"someone who takes care of my space"},{name:"Move my body 30 min",cue:"After school",identity:"a strong, healthy athlete"},{name:"Say one kind thing to a brother",cue:"At dinner",identity:"a good big brother"}],
  rowan:[{name:"Read 15 minutes",cue:"After I brush my teeth at night",identity:"a reader"},{name:"Make my bed",cue:"After I get up",identity:"someone who takes care of my stuff"},{name:"Practice something hard for 10 min",cue:"After snack",identity:"someone who gets better every day"},{name:"Help with one chore",cue:"Before screen time",identity:"a helpful teammate"}],

};
const STARTER_MISSIONS={
  kellan:[{title:"Give a 3-minute talk at dinner about something I love",type:"Life skill",steps:["Pick a topic","Write 3 big points","Practice once in the mirror","Present at dinner"]},{title:"Earn and save $20",type:"Money",steps:["Pick a job I can do","Do the work","Put it in my jar","Decide: save, spend, or give"]}],

};
const COINS={goal:20,mission:25,goalset:5,journal:3,allhabits:5,brave:3,sprint:5,winXP:10};
const INTERESTS=["Sports","Building & LEGO","Art","Music","Reading","Animals","Science","Cooking","Outdoors","Math","Writing","Video games"];
const CALM_CHOICES=["A hug","Being alone for a bit","Moving my body","Talking it out","Music","Deep breaths","Cold water","Drawing"];
const IDEAS={"Sports":["Make 10 free throws in a row","Run a mile without stopping"],"Building & LEGO":["Build something with no instructions and show the family","Design and build a marble run"],"Art":["Draw the same thing every day for a week and compare","Make a birthday card for someone, start to finish"],"Music":["Learn one song all the way through","Play a song for the family at dinner"],"Reading":["Read a book over 150 pages","Read to a brother 5 nights in a row"],"Animals":["Teach the dog a new trick","Be in charge of feeding the dogs for a week"],"Science":["Do an experiment and explain what happened","Grow something from a seed"],"Cooking":["Cook breakfast for the family","Learn 3 recipes by heart"],"Outdoors":["Hike a new trail with the family","Build a fort outside that lasts a week"],"Math":["Learn all the multiplication facts to 12","Teach a brother a math trick"],"Writing":["Write a 2-page story and read it aloud","Keep a journal for 7 days straight"],"Video games":["Beat a hard level with no help, then teach someone","Go 3 school days with zero game time and notice how you feel"]};
const QBANK=[

function focusAreas(pr){

  if(pr.stuck==="Give up for now")f.push("grit");if(pr.stuck==="Keep trying"&&pr.learn!=="Someone explaining it")f.push("help");
  if(pr.social==="A little scary"||pr.social==="Really scary")f.push("confidence");
  if(pr.friend==="Don't know what to do"||pr.friend==="Tell a grown-up")f.push("empathy");
  if(["Frustrated","Nervous","Sad"].includes(pr.bigfeel))f.push("calm");
  if(pr.brothers==="Fight sometimes"||pr.brothers==="Fight a lot"||pr.mad==="Brothers bugging me")f.push("kindness");
  if(pr.money==="Spend it right away")f.push("money");
  if(pr.focus==="5 minutes"||pr.focus==="10 minutes")f.push("focus");
  if(pr.mad==="Losing")f.push("losing");

  return [...new Set(f)];
}

firebase.initializeApp(window.FB_CONFIG);
const auth=firebase.auth(), db=firebase.firestore();
let S={active:null,kids:{},rewards:null,approve:true,parents:[],familyName:""};
let fid=null, me=null, isParent=false, authReady=false, famReady=false, kidsReady=false, unsubs=[], gateErr="", gateView="home", busy=false;
const lastSync={};
function pref(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}}
function setPref(o){try{localStorage.setItem(KEY,JSON.stringify({...pref(),...o}))}catch(e){}}
function save(){setPref({active:S.active});clearTimeout(save._t);save._t=setTimeout(flush,250)}
function flush(){
  if(!fid||!kidsReady)return;
  const fam={rewards:S.rewards,approve:S.approve};const fj=JSON.stringify(fam);
  if(fj!==lastSync.__fam&&isParent){lastSync.__fam=fj;db.doc("families/"+fid).set(fam,{merge:true}).catch(e=>toast("Couldn't save settings: "+e.code))}
  for(const id in S.kids){const j=JSON.stringify(S.kids[id]);if(j!==lastSync[id]){lastSync[id]=j;db.doc("families/"+fid+"/kids/"+id).set(JSON.parse(j)).catch(e=>toast("Couldn't sync: "+e.code))}}
}
function stopSync(){unsubs.forEach(u=>u());unsubs=[];famReady=false;kidsReady=false}
function startSync(){
  stopSync();
  unsubs.push(db.doc("families/"+fid).onSnapshot(d=>{
    if(!d.exists){gateErr="That family code doesn't exist.";fid=null;setPref({fid:null});stopSync();render();return}
    const f=d.data();S.rewards=f.rewards||null;S.approve=f.approve!==false;S.parents=f.parents||[];S.familyName=f.name||"";
    lastSync.__fam=JSON.stringify({rewards:S.rewards,approve:S.approve});
    isParent=!!(me&&!me.isAnonymous&&S.parents.includes(me.uid));
    famReady=true;render();
  },e=>{gateErr="Can't open that family ("+e.code+").";fid=null;setPref({fid:null});stopSync();render()}));
  unsubs.push(db.collection("families/"+fid+"/kids").onSnapshot(q=>{
    q.docChanges().forEach(ch=>{if(ch.type==="removed")delete S.kids[ch.doc.id];else{S.kids[ch.doc.id]=ch.doc.data();lastSync[ch.doc.id]=JSON.stringify(S.kids[ch.doc.id])}});
    kidsReady=true;render();
  },e=>{gateErr="Can't read kids ("+e.code+")";render()}));
}
auth.onAuthStateChanged(u=>{me=u;authReady=true;const p=pref();
  if(u){if(p.fid){fid=p.fid;S.active=p.active||null;startSync()}else if(!u.isAnonymous){findFamily(u.uid)}}
  else{fid=null;stopSync()}
  render();
});
async function findFamily(uid){busy=true;render();try{const q=await db.collection("families").where("parents","array-contains",uid).limit(1).get();if(!q.empty){fid=q.docs[0].id;setPref({fid});startSync()}else gateView="family"}catch(e){gateErr="Couldn't look up your family ("+e.code+")."}busy=false;render()}
function genCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let c="";for(let i=0;i<8;i++)c+=A[Math.floor(Math.random()*A.length)];return c}
async function createFamily(name){
  const code=genCode();await db.doc("families/"+code).set({name:name||"Our family",parents:[me.uid],rewards:DEFAULT_REWARDS.map(r=>({id:uid(),...r})),approve:true,created:new Date().toISOString()});
  fid=code;setPref({fid});startSync();
}
async function joinFamilyAsParent(code){

}

function uid(){return Math.random().toString(36).slice(2,9)}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dayKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return dayKey(d)}
function weekKey(){const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return dayKey(d)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function ensureKid(id){
  if(!S.kids[id]){
    if(!kidsReady)return {xp:0,habits:[],missions:[],checkins:{},journal:{},sprints:[],coach:[],badges:[],echoes:{},quest:{},coins:0,chores:[],choreLog:[],redemptions:[],wins:[],goals:[]};

function choreDue(c,dateKeyStr){const d=new Date(dateKeyStr+"T12:00:00");if(c.freq==="daily")return true;if(c.freq==="weekly")return d.getDay()===c.day;if(c.freq==="once")return !K().choreLog.some(l=>l.chore===c.id&&l.status!=="rejected");return true}
function choreEntry(k,cid,date){return k.choreLog.find(l=>l.chore===cid&&l.date===date&&l.status!=="rejected")}
function pendingCount(k){return k.choreLog.filter(l=>l.status==="pending").length+k.redemptions.filter(r=>r.status==="pending").length+(k.wins||[]).filter(w=>w.status==="pending").length}

function levelOf(xp){let i=0;for(let j=0;j<LEVELS.length;j++)if(xp>=LEVELS[j][0])i=j;const cur=LEVELS[i],next=LEVELS[i+1];return {n:i+1,name:cur[1],cur:cur[0],next:next?next[0]:null,pct:next?Math.round((xp-cur[0])/(next[0]-cur[0])*100):100}}

function streak(h){let s=0;for(let i=0;i<365;i++){if(h.done.includes(daysAgo(i)))s++;else if(i===0)continue;else break}return s}
function checkinStreak(k){let s=0;for(let i=0;i<365;i++){if(k.checkins[daysAgo(i)])s++;else if(i===0)continue;else break}return s}

function daysUntil(d){if(!d)return null;const a=new Date(d+"T12:00:00"),b=new Date();b.setHours(12,0,0,0);return Math.round((a-b)/86400000)}

function weekStart(){const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return dayKey(d)}
function goalPct(g){const n=(g.steps||[]).length;return n?Math.round(g.steps.filter(x=>x.done).length/n*100):0}
function nextStep(g){return (g.steps||[]).find(x=>!x.done)}
function needsCheckin(g){if(g.done)return false;const w=weekStart();if((g.checkins||[]).some(c=>c.week===w))return false;return (g.created||"")<w||true}

  if(changed)save();
}

    return `<section class="card stack" style="border-left:8px solid var(--accent)"><div class="row between"><h2>Needs your OK</h2><span class="pill">${items.length}</span></div>${items.length?items.join(""):`<p class="muted">Nothing waiting.</p>`}</section>`})()}
  ${Object.entries(KIDS).map(([id,kid])=>{const k=ensureKid(id);const lv=levelOf(k.xp);const t=today();const last7=[0,1,2,3,4,5,6].map(i=>daysAgo(i));
    return `<details class="card" ${id===S.active?"open":""}><summary><span class="avatar" style="--kid:${kid.color};width:34px;height:34px;font-size:16px">${kid.name[0]}</span>${kid.name} · Level ${lv.n} ${lv.name} · ${k.xp} XP</summary>
    <div class="stack" style="margin-top:12px">
      <div class="row"><span class="pill">${checkinStreak(k)}-day check-in streak</span><span class="pill">${Object.keys(k.journal).length} journal entries</span><span class="pill">${k.sprints.length} focus sprints</span><span class="pill">${(k.goals||[]).filter(g=>g.done).length} goals done</span></div>
      <h3>Last 7 days</h3>
      <div class="tablewrap"><table><thead><tr><th>Day</th><th>Weather</th><th>Temp</th><th>Habits</th><th>Journal</th></tr></thead><tbody>${last7.map(d=>{const c=k.checkins[d]||{};const j=k.journal[d];const hd=k.habits.filter(h=>h.done.includes(d)).length;return `<tr><td class="num">${d.slice(5).replace("-","/")}</td><td>${c.weather?WX[c.weather].l:"—"}</td><td class="num">${c.temp||"—"}</td><td class="num">${hd}/${k.habits.length}</td><td>${j?esc(j.tried)+(j.coach?" · <i>"+esc(j.coach)+"</i>":""):"—"}</td></tr>`}).join("")}</tbody></table></div>
      <label class="f">Parent echo for this week ("This week, I saw you...")<textarea class="t" id="echo-${id}" data-echo="${id}" placeholder="This week, I saw you keep going on your math even when you were frustrated.">${esc(k.echoes[weekKey()]||"")}</textarea></label>
      <div class="row"><button class="btn primary" data-saveecho="${id}">Save note</button><button class="btn ghost" data-bonus="${id}">Give +25 bonus XP</button><button class="btn ghost" data-copysummary="${id}">Copy weekly summary</button></div>
      <h3>Habits</h3>
      <div class="stack">${k.habits.map(h=>`<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(h.name)} <span class="small muted">· ${streak(h)} day chain</span></span><button class="btn sm ghost" data-pdelhabit="${id}:${h.id}">Remove</button></div>`).join("")||"<p class='muted small'>None</p>"}</div>
      <div class="row between"><h3>Chores</h3><span class="row" style="gap:6px"><span class="coinpill">${I.coin}${k.coins||0}</span><button class="btn sm ghost" data-coinadj="${id}:10">+10</button><button class="btn sm ghost" data-coinadj="${id}:-10">−10</button><button class="btn sm primary" data-addchore="${id}">+ Chore</button></span></div>
      <div class="stack">${k.chores.map(c=>`<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(c.name)} <span class="small muted">· ${c.freq==="daily"?"daily":c.freq==="weekly"?DAYN[c.day]+"s":"once"} · ${c.pts} coins</span></span><button class="btn sm ghost" data-pdelchore="${id}:${c.id}">Remove</button></div>`).join("")||"<p class='muted small'>None</p>"}</div>
      ${k.profile?`<details><summary>About ${kid.name} (their answers)</summary><div class="stack small" style="margin-top:8px">${focusAreas(k.profile).length?`<div><b>Focus areas:</b> ${focusAreas(k.profile).map(x=>FOCUS_LABELS[x]).join(", ")}</div>`:""}${QBANK.filter(q=>q.id).map(q=>`<div><b>${esc(q.q)}</b> ${Array.isArray(k.profile[q.id])?(k.profile[q.id].map(esc).join(", ")||"—"):(esc(k.profile[q.id])||"—")}${q.id==="reward"&&k.profile.reward?` <button class="btn sm ghost" data-rewardfrom="${esc(k.profile.reward)}">Add to shop</button>`:""}</div>`).join("")}<div class="muted">Updated ${k.profile.updated||""}</div></div></details>`:`<p class="small muted">${kid.name} hasn't filled out About Me yet.</p>`}
      <h3>Wins</h3>
      <div class="stack">${(k.wins||[]).slice(-5).reverse().map(w=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="small muted num">${w.date.slice(5).replace("-","/")}</span> <b>${esc(w.cat)}</b> · ${esc(w.text)} ${w.status==="approved"?`<span class="coinpill">${I.coin}+${w.coins||0}</span>`:`<span class="pill">pending</span>`}</div>`).join("")||`<p class="muted small">None yet</p>`}</div>
      <h3>Goals</h3>
      <div class="stack">${(k.goals||[]).map(g=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(g.title||g.specific)} <span class="small muted">· ${goalPct(g)}%${g.due?" · due "+fmtDate(g.due):""}${g.done?" · done":""}${(g.checkins||[]).length?" · last check-in: "+esc(g.checkins[g.checkins.length-1].rating):""}</span></span>${nextStep(g)&&!g.done?`<div class="small muted">Next: ${esc(nextStep(g).t)}</div>`:""}</div>`).join("")||"<p class='muted small'>None</p>"}</div>
    </div></details>`}).join("")}
  <section class="card stack">
    <div class="row between"><h2>Rewards shop (all three boys)</h2><button class="btn sm primary" data-act="addreward">+ Reward</button></div>
    <div class="stack">${(S.rewards||[]).map(r=>`<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(r.name)}</span><span class="row" style="gap:6px"><span class="coinpill">${I.coin}${r.cost}</span><button class="btn sm ghost" data-delreward="${r.id}">Remove</button></span></div>`).join("")}</div>
    <div class="row between" style="margin-top:6px"><span><b>Chores need parent approval</b><br><span class="small muted">${S.approve?"On: coins land after you tap Approve.":"Off: coins land the moment they tap the box."}</span></span><button class="btn sm ${S.approve?"primary":"ghost"}" data-act="toggleapprove">${S.approve?"On":"Off"}</button></div>
    <p class="small muted">Rough scale: a daily 2-minute chore is 2–3 coins, a 15-minute weekly job is 8–15. That makes "$5" about two weeks of consistent work.</p>
  </section>
  <section class="card stack">
    <h2>Settings</h2>
    <div class="row"><button class="btn" data-act="export">Copy backup</button><button class="btn ghost" data-act="signout">Sign out of this device</button></div>
    <p class="small muted">Signed in as ${esc(me&&me.email||"")}. Everything syncs live across every device on this family code. Sign out turns this device back into a kid device (it keeps the family code).</p>
  </section>
  <section class="card stack">
    <h2>How to use this with the boys</h2>
    <div class="tip"><div class="n">1</div><div><b>Morning: weather + thermometer.</b><p class="small">30 seconds at breakfast. "What's your weather?" normalizes feelings and gives you a read on the day.</p></div></div>
    <div class="tip"><div class="n">2</div><div><b>After school: habits + one brave thing.</b><p class="small">They check their own boxes. You don't nag; the chain does the work. Praise effort and identity ("you're becoming a reader"), not outcomes.</p></div></div>
    <div class="tip"><div class="n">3</div><div><b>Bedtime: Brave Book.</b><p class="small">Ask "what did your Critic say today, and what did your Coach say back?" Two minutes. It's the Confidence Journal from the playbook, made daily.</p></div></div>
    <div class="tip"><div class="n">4</div><div><b>Friday: review together, write the echo.</b><p class="small">Read the week's table with them. Write one specific "I saw you..." sentence. Specific beats "good job" every time.</p></div></div>
    <div class="tip"><div class="n">5</div><div><b>Let them own the missions.</b><p class="small">Kids work harder on goals they chose. Offer the life-skill quests; let them pick and break it into levels.</p></div></div>
  </section>`;
}
function renderModal(){
  const m=modal;
  if(m.type==="pin"){
    const title=pinMode==="set"?"Set a parent PIN":pinMode==="confirm"?"Enter it again":"Parent PIN";
    return `<div class="modal" data-close><div class="card" style="max-width:360px">
      <div class="row between"><h2>${title}</h2><button class="btn sm ghost" data-act="closemodal">✕</button></div>
      <p class="small muted">${pinMode==="set"?"4 digits. You'll use it to open Parent Mode on this iPad.":pinMode==="confirm"?"":"For grown-ups only."}</p>
      <div class="dots">${[0,1,2,3].map(i=>`<i class="${pinBuf.length>i?"on":""}"></i>`).join("")}</div>
      <div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-pin="${n}">${n}</button>`).join("")}<button data-pin="back">⌫</button><button data-pin="0">0</button><button data-pin="clear">C</button></div>
    </div></div>`;
  }
  if(m.type==="habit"){
    const h=m.habit||{};
    return `<div class="modal" data-close><div class="card">
      <div class="row between"><h2>${h.id?"Edit habit":"New habit"}</h2><button class="btn sm ghost" data-act="closemodal">✕</button></div>
      <form class="stack" data-form="habit" style="margin-top:12px">
        <label class="f">The habit (make it tiny)<input class="t" id="h-name" name="name" required value="${esc(h.name)}" placeholder="Read one page"></label>
        <label class="f">Stack it: after I...<input class="t" id="h-cue" name="cue" value="${esc(h.cue)}" placeholder="After I brush my teeth"></label>
        <label class="f">I'm becoming... <input class="t" id="h-identity" name="identity" value="${esc(h.identity)}" placeholder="a reader"></label>
        <div class="row"><button class="btn primary" type="submit">Save</button>${h.id?`<button class="btn ghost" type="button" data-delhabit="${h.id}">Delete</button>`:""}</div>
      </form></div></div>`;
  }
  if(m.type==="aboutme"){
    const pr=K().profile||{};let n=0;
    const field=q=>{if(q.sec)return `<h3 style="margin-top:6px;color:var(--kid)">${q.sec}</h3>`;n++;const lab=`${n}. ${esc(q.q)}`;
      if(q.type==="text")return `<label class="f">${lab}<input class="t" id="am-${q.id}" name="${q.id}" value="${esc(pr[q.id]||"")}" placeholder="${esc(q.ph||"")}"></label>`;
      const multi=q.type==="multi";const sel=pr[q.id];
      return `<label class="f">${lab}<div class="chips">${q.opts.map(x=>`<button type="button" class="chip" data-${multi?"multi":"single"}="am-${q.id}" data-val="${esc(x)}" aria-pressed="${multi?(sel||[]).includes(x):sel===x}">${esc(x)}</button>`).join("")}</div><input type="hidden" id="am-${q.id}" name="${q.id}" value="${esc(multi?(sel||[]).join("|"):(sel||""))}"></label>`};
    return `<div class="modal" data-close><div class="card">
      <div class="row between"><h2>About me</h2><button class="btn sm ghost" data-act="closemodal">✕</button></div>
      <p class="small muted">Tap your answers. No wrong ones. Skip any you want. The app uses these to pick games, goals and brave things that fit you.</p>
      <form class="stack" data-form="aboutme" style="margin-top:12px;gap:16px">
        ${QBANK.map(field).join("")}
        <button class="btn primary block" type="submit">Save (+${XP.aboutme} XP)</button>
      </form></div></div>`;
  }
  if(m.type==="goal"){
    const def=new Date();def.setDate(def.getDate()+21);
    return `<div class="modal" data-close><div class="card">
      <div class="row between"><h2>New goal</h2><button class="btn sm ghost" data-act="closemodal">✕</button></div>
      <form class="stack" data-form="goal" style="margin-top:12px">
        <label class="f">What do you want to be able to do?<input class="t" id="g-title" name="title" required value="${esc(m.title||"")}" placeholder="Do a kickflip"></label>
        <label class="f">What are the steps to get there? (one per line, first step first)<textarea class="t" id="g-steps" name="steps" rows="5" required placeholder="Learn to ollie&#10;Practice the flick 10 min a day for a week&#10;Land it once with a hand on the fence&#10;Land it 3 times in a row">${esc(m.steps||"")}</textarea><span class="small muted" style="text-transform:none;letter-spacing:0;font-weight:600">Tip: the first step should be something you can do today.</span></label>
        <label class="f">By when?<input class="t" type="date" id="g-due" name="due" value="${dayKey(def)}"></label>
        <label class="f">Why do you want this? (optional)<input class="t" id="g-why" name="why" placeholder="So I can skate with my friends"></label>
        <button class="btn primary block" type="submit">Set goal (+${XP.goalset} XP)</button>
      </form></div></div>`;
  }
  if(m.type==="addstep"){
    return `<div class="modal" data-close><div class="card">
      <div class="row between"><h2>Add a step</h2><button class="btn sm ghost" data-act="closemodal">✕</button></div>
      <form class="stack" data-form="addstep" style="margin-top:12px"><input class="t" id="as-text" name="text" required placeholder="What's the next thing to do?"><button class="btn primary" type="submit">Add</button></form></div></div>`;
  }
  if(m.type==="checkin"){
    const g=K().goals.find(x=>x.id===m.gid);const ns=g?nextStep(g):null;
    return `<div class="modal" data-close><div class="card">
      <div class="row between"><h2>Weekly check-in</h2><button class="btn sm ghost" data-act="closemodal">✕</button></div>
      <p><b>${esc(g?g.title:"")}</b> · ${g?goalPct(g):0}% done</p>
      <form class="stack" data-form="checkin" style="margin-top:12px">
        <label class="f">How did this week go?<div class="chips">${["Crushed it","Made progress","Got stuck","Didn't start"].map((r,i)=>`<button type="button" class="chip" data-rating="${r}" aria-pressed="${i===1}">${r}</button>`).join("")}</div><input type="hidden" id="ci-rating" name="rating" value="Made progress"></label>
        <label class="f">What happened? (one line)<input class="t" id="ci-note" name="note" placeholder="Practiced 4 days. Landed it once!"></label>
        <label class="f">What's the one step for next week?<input class="t" id="ci-next" name="next" value="${esc(ns?ns.t:"")}" placeholder="Land it twice in a row"></label>
        <button class="btn primary block" type="submit">Save check-in (+${XP.checkinGoal} XP)</button>
      </form></div></div>`;
  }
  if(m.type==="chore"){
    return `<div class="modal" data-close><div class="card">
      <div class="row between"><h2>New chore for ${KIDS[m.kid].name}</h2><button class="btn sm ghost" data-act="closemodal">✕</button></div>
      <form class="stack" data-form="chore" style="margin-top:12px">
        <label class="f">Chore<input class="t" id="c-name" name="name" required placeholder="Feed the dog"></label>
        <label class="f">Coins<input class="t" id="c-pts" name="pts" type="number" min="1" max="500" value="5" required></label>
        <label class="f">How often<div class="chips">${[["daily","Every day"],["weekly","Once a week"],["once","One time"]].map(([v,l])=>`<button type="button" class="chip" data-cfreq="${v}" aria-pressed="${v==="daily"}">${l}</button>`).join("")}</div><input type="hidden" id="c-freq" name="freq" value="daily"></label>
        <label class="f" id="c-dayrow" hidden>Which day<select class="t" id="c-day" name="day">${DAYN.map((d,i)=>`<option value="${i}" ${i===6?"selected":""}>${d}</option>`).join("")}</select></label>
        <button class="btn primary" type="submit">Add chore</button>
      </form></div></div>`;
  }
  if(m.type==="reward"){
    return `<div class="modal" data-close><div class="card">
      <div class="row between"><h2>New reward</h2><button class="btn sm ghost" data-act="closemodal">✕</button></div>
      <form class="stack" data-form="reward" style="margin-top:12px">
        <label class="f">Reward<input class="t" id="r-name" name="name" required value="${esc(m.name||"")}" placeholder="Trip to the trampoline park"></label>
        <label class="f">Cost in coins<input class="t" id="r-cost" name="cost" type="number" min="1" max="5000" value="50" required></label>
        <button class="btn primary" type="submit">Add reward</button>
      </form></div></div>`;
  }
  if(m.type==="parentlogin"){
    return `<div class="modal" data-close><div class="card">
      <div class="row between"><h2>Parent sign in</h2><button class="btn sm ghost" data-act="closemodal">✕</button></div>
      <p class="small muted">For Dad and Mom only.</p>${m.err?`<p class="err">${esc(m.err)}</p>`:""}
      <form class="stack" data-form="parentlogin" style="margin-top:12px"><label class="f">Email<input class="t" id="pm-email" name="email" type="email" autocomplete="username" required></label><label class="f">Password<input class="t" id="pm-pass" name="pass" type="password" autocomplete="current-password" minlength="6" required></label>
      <div class="row"><button class="btn primary" type="submit" data-mode="in">Sign in</button><button class="btn" type="submit" data-mode="up">Create account</button></div></form></div></div>`;
  }
  if(m.type==="import"){
    return `<div class="modal" data-close><div class="card">
      <div class="row between"><h2>Restore from backup</h2><button class="btn sm ghost" data-act="closemodal">✕</button></div>
      <form class="stack" data-form="import" style="margin-top:12px"><label class="f">Paste the backup text<textarea class="t" id="imp" name="data" rows="6"></textarea></label><button class="btn primary" type="submit">Restore (replaces this iPad's data)</button></form></div></div>`;
  }
  return "";
}

/* ---------- actions ---------- */
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),1800)}
function openPin(mode){pinMode=mode;pinBuf="";modal={type:"pin"};render()}
function bind(){
  app.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{S.active=b.dataset.pick;ensureKid(S.active);save();tab="today";render()});
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;if(tab==="missions")tab="goals";coachRound=null;render();document.querySelector(".main").scrollTop=0});
  app.querySelectorAll("[data-act]").forEach(b=>b.onclick=e=>act(b.dataset.act,b,e));
  app.querySelectorAll("[data-wx]").forEach(b=>b.onclick=()=>{const k=K(),t=today(),c=k.checkins[t]||{};const first=!c.weather;c.weather=b.dataset.wx;k.checkins[t]=c;save();if(first)addXP(XP.checkin,"weather logged");render()});
  app.querySelectorAll("[data-temp]").forEach(b=>b.onclick=()=>{const k=K(),t=today(),c=k.checkins[t]||{};c.temp=+b.dataset.temp;c.high=Math.max(c.high||0,c.temp);k.checkins[t]=c;save();render()});
  app.querySelectorAll("[data-habit]").forEach(b=>b.onclick=()=>{const k=K(),h=k.habits.find(x=>x.id===b.dataset.habit),t=today();if(h.done.includes(t)){h.done=h.done.filter(d=>d!==t);k.xp=Math.max(0,k.xp-XP.habit);save()}else{h.done.push(t);save();addXP(XP.habit,streak(h)>1?streak(h)+" day chain!":"habit done");if(k.habits.every(x=>x.done.includes(t)))setTimeout(()=>addCoins(COINS.allhabits,"every habit done today"),1200)}render()});
  app.querySelectorAll("[data-edithabit]").forEach(b=>b.onclick=()=>{modal={type:"habit",habit:K().habits.find(x=>x.id===b.dataset.edithabit)};render()});
  app.querySelectorAll("[data-delhabit]").forEach(b=>b.onclick=()=>{const k=K();k.habits=k.habits.filter(x=>x.id!==b.dataset.delhabit);save();modal=null;render()});
  app.querySelectorAll("[data-gstep]").forEach(b=>b.onclick=()=>{const [gid,i]=b.dataset.gstep.split(":");const g=K().goals.find(x=>x.id===gid);const st=g.steps[+i];st.done=!st.done;st.doneAt=st.done?today():null;save();if(st.done)addXP(XP.goalstep,"step done");render()});
  app.querySelectorAll("[data-addstep]").forEach(b=>b.onclick=()=>{modal={type:"addstep",gid:b.dataset.addstep};render()});
  app.querySelectorAll("[data-checkin]").forEach(b=>b.onclick=()=>{modal={type:"checkin",gid:b.dataset.checkin};render()});
  app.querySelectorAll("[data-sughabit]").forEach(b=>b.onclick=()=>{const h=Object.values(FOCUS_HABITS).find(x=>x.name===b.dataset.sughabit);if(!h)return;K().habits.push({id:uid(),name:h.name,cue:h.cue,identity:h.identity,done:[]});save();toast("Habit added");render()});
  app.querySelectorAll("[data-ideagoal]").forEach(b=>b.onclick=()=>{modal={type:"goal",title:b.dataset.ideagoal,steps:""};render()});
  app.querySelectorAll("[data-questmission]").forEach(b=>b.onclick=()=>{modal={type:"goal",title:QUESTS[+b.dataset.questmission].replace(/\.$/,""),steps:"Make a plan\nDo it once\nDo it again, better"};render()});
  app.querySelectorAll("[data-chore]").forEach(b=>b.onclick=()=>{const k=K(),t=today(),c=k.chores.find(x=>x.id===b.dataset.chore);const e=choreEntry(k,c.id,t);if(e){if(e.status==="pending"){k.choreLog=k.choreLog.filter(x=>x!==e);save();render()}return}const entry={id:uid(),chore:c.id,name:c.name,pts:c.pts,date:t,status:S.approve?"pending":"approved"};k.choreLog.push(entry);save();if(S.approve)toast("Nice. A parent will check it.");else addCoins(c.pts,c.name);render()});
  app.querySelectorAll("[data-redeem]").forEach(b=>b.onclick=()=>{const k=K(),r=S.rewards.find(x=>x.id===b.dataset.redeem);if((k.coins||0)<r.cost)return;if(!b.dataset.confirm){b.dataset.confirm="1";b.textContent="Spend "+r.cost+"?";return}k.coins-=r.cost;k.redemptions.push({id:uid(),reward:r.id,name:r.name,cost:r.cost,date:today(),status:"pending"});save();toast("Asked for: "+r.name);render()});
  app.querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>{const [kid,lid,verdict]=b.dataset.approve.split(":");const k=ensureKid(kid);const e=k.choreLog.find(x=>x.id===lid);if(!e)return;if(verdict==="ok"){e.status="approved";addCoins(e.pts,e.name,kid)}else{e.status="rejected"}save();render()});
  app.querySelectorAll("[data-redeemdone]").forEach(b=>b.onclick=()=>{const [kid,rid,verdict]=b.dataset.redeemdone.split(":");const k=ensureKid(kid);const r=k.redemptions.find(x=>x.id===rid);if(!r)return;if(verdict==="ok")r.status="done";else{r.status="refunded";k.coins+=r.cost}save();render()});
  app.querySelectorAll("[data-coinadj]").forEach(b=>b.onclick=()=>{const [kid,n]=b.dataset.coinadj.split(":");addCoins(+n,"parent adjustment",kid);render()});
  app.querySelectorAll("[data-pdelchore]").forEach(b=>b.onclick=()=>{const [kid,cid]=b.dataset.pdelchore.split(":");const k=ensureKid(kid);k.chores=k.chores.filter(c=>c.id!==cid);save();render()});
  app.querySelectorAll("[data-addchore]").forEach(b=>b.onclick=()=>{modal={type:"chore",kid:b.dataset.addchore};render()});
  app.querySelectorAll("[data-rewardfrom]").forEach(b=>b.onclick=()=>{modal={type:"reward",name:b.dataset.rewardfrom};render()});
  app.querySelectorAll("[data-delreward]").forEach(b=>b.onclick=()=>{S.rewards=S.rewards.filter(r=>r.id!==b.dataset.delreward);save();render()});
  app.querySelectorAll("[data-cfreq]").forEach(b=>b.onclick=()=>{app.querySelectorAll("[data-cfreq]").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");document.getElementById("c-freq").value=b.dataset.cfreq;document.getElementById("c-dayrow").hidden=b.dataset.cfreq!=="weekly"});
  app.querySelectorAll("[data-wcat]").forEach(b=>b.onclick=()=>{app.querySelectorAll("[data-wcat]").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");document.getElementById("w-cat").value=b.dataset.wcat});
  app.querySelectorAll("[data-winaward]").forEach(b=>b.onclick=()=>{const [kid,wid,n]=b.dataset.winaward.split(":");const k=ensureKid(kid);const w=k.wins.find(x=>x.id===wid);if(!w)return;w.status="approved";w.coins=+n;const note=document.getElementById("wn-"+wid);if(note&&note.value.trim())w.note=note.value.trim();if(+n>0)addCoins(+n,"win bonus",kid);save();render()});
  app.querySelectorAll("[data-goaldone]").forEach(b=>b.onclick=()=>{const g=K().goals.find(x=>x.id===b.dataset.goaldone);g.done=true;g.doneAt=today();save();addXP(XP.goal,"GOAL DONE");setTimeout(()=>addCoins(COINS.goal,"goal bonus"),1200);render()});
  app.querySelectorAll("[data-delgoal]").forEach(b=>b.onclick=()=>{if(b.dataset.confirm){const k=K();k.goals=k.goals.filter(x=>x.id!==b.dataset.delgoal);save();render()}else{b.dataset.confirm="1";b.textContent="Tap again to remove"}});
  app.querySelectorAll("[data-freshmission]").forEach(b=>b.onclick=()=>{const m=freshMissions()[+b.dataset.freshmission];if(!m)return;const k=K();k.goals=k.goals||[];k.goals.unshift({id:uid(),title:m.title,type:m.type,steps:m.steps.map(t=>({t,done:false})),done:false,created:today(),checkins:[],why:""});save();addXP(XP.goalset,"new goal");render()});
  app.querySelectorAll("[data-sprint]").forEach(b=>b.onclick=()=>startTimer(+b.dataset.sprint,null));
  app.querySelectorAll("[data-focus]").forEach(b=>b.onclick=()=>{const g=K().goals.find(x=>x.id===b.dataset.focus);startTimer(15,g?g.title:null)});
  app.querySelectorAll("[data-feel]").forEach(b=>b.onclick=()=>{const inp=document.getElementById("j-felt");const cur=inp.value.split(",").map(s=>s.trim()).filter(Boolean);const f=b.dataset.feel;const i=cur.indexOf(f);if(i>=0)cur.splice(i,1);else cur.push(f);inp.value=cur.join(", ");b.setAttribute("aria-pressed",String(i<0))});
  app.querySelectorAll("[data-coach]").forEach(b=>b.onclick=()=>{if(coachRound.picked!=null)return;coachRound.picked=+b.dataset.coach;const k=K();k.coach=k.coach||[];k.coach.push({d:today(),i:coachRound.i,o:coachRound.picked});save();addXP(XP.coach,"Coach voice");render()});
  app.querySelectorAll("[data-game]").forEach(b=>b.onclick=()=>game(b.dataset.game));
  app.querySelectorAll("[data-pin]").forEach(b=>b.onclick=()=>pinPress(b.dataset.pin));
  app.querySelectorAll("[data-multi]").forEach(b=>b.onclick=()=>{const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",String(on));const hid=document.getElementById(b.dataset.multi);const cur=hid.value?hid.value.split("|"):[];const v=b.dataset.val;const i=cur.indexOf(v);if(on&&i<0)cur.push(v);if(!on&&i>=0)cur.splice(i,1);hid.value=cur.join("|")});
  app.querySelectorAll("[data-single]").forEach(b=>b.onclick=()=>{app.querySelectorAll(`[data-single="${b.dataset.single}"]`).forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");document.getElementById(b.dataset.single).value=b.dataset.val});
  app.querySelectorAll("[data-rating]").forEach(b=>b.onclick=()=>{app.querySelectorAll("[data-rating]").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");document.getElementById("ci-rating").value=b.dataset.rating});
  app.querySelectorAll("[data-saveecho]").forEach(b=>b.onclick=()=>{const id=b.dataset.saveecho;const v=document.getElementById("echo-"+id).value.trim();ensureKid(id).echoes[weekKey()]=v;save();toast("Saved for "+KIDS[id].name)});
  app.querySelectorAll("[data-bonus]").forEach(b=>b.onclick=()=>{ensureKid(b.dataset.bonus).xp+=25;save();toast("+25 XP for "+KIDS[b.dataset.bonus].name);render()});
  app.querySelectorAll("[data-copysummary]").forEach(b=>b.onclick=()=>copyText(summary(b.dataset.copysummary),"Summary copied"));
  app.querySelectorAll("[data-pdelhabit]").forEach(b=>b.onclick=()=>{const [kid,hid]=b.dataset.pdelhabit.split(":");const k=ensureKid(kid);k.habits=k.habits.filter(h=>h.id!==hid);save();render()});
  app.querySelectorAll("[data-gate]").forEach(b=>b.onclick=()=>{gateView=b.dataset.gate;gateErr="";render()});
  app.querySelectorAll("form[data-form=parentlogin] button[type=submit]").forEach(b=>b.onclick=()=>{b.form.dataset.mode=b.dataset.mode});
  app.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{modal=null;render()});
  app.querySelectorAll(".modal .card").forEach(c=>c.onclick=e=>e.stopPropagation());
  app.querySelectorAll("form[data-form]").forEach(f=>f.onsubmit=e=>{e.preventDefault();submit(f)});
  app.querySelectorAll("textarea.t, input.t").forEach(i=>i.onclick=e=>e.stopPropagation());
}
function act(a,b){
  const k=S.active?K():null,t=today();
  if(a==="switch"){S.active=null;setPref({active:null});render()}
  else if(a==="parent"){if(isParent){tab="parent";render()}else{modal={type:"parentlogin"};render()}}
  else if(a==="parentnow"){S.active=Object.keys(KIDS)[0];tab="parent";render()}
  else if(a==="lockparent"){tab="today";render()}
  else if(a==="freshseen"){try{localStorage.setItem("fresh-seen",(freshDeck()||{}).week||"")}catch(e){}render()}
  else if(a==="copycode"){copyText(fid,"Family code copied")}
  else if(a==="signout"){const p=pref();auth.signOut().then(()=>{isParent=false;tab="today";S.active=null;gateView="home";if(p.kidDevice&&p.fid){auth.signInAnonymously()}else{setPref({fid:null,kidDevice:false});fid=null;stopSync()}render()})}
  else if(a==="closemodal"){modal=null;render()}
  else if(a==="questdone"){k.quest[t+"_done"]=true;save();addXP(XP.step,"brave thing");setTimeout(()=>addCoins(COINS.brave,"brave thing"),1200);render()}
  else if(a==="questnew"){const QP=QUESTS.concat(((freshDeck()||{}).quests)||[]).concat(myFocus().flatMap(x=>FOCUS_QUESTS[x]||[]));k.quest[t]=QP[(QP.indexOf(k.quest[t])+1+Math.floor(Math.random()*(QP.length-1)))%QP.length];delete k.quest[t+"_done"];save();render()}
  else if(a==="addhabit"){modal={type:"habit"};render()}
  else if(a==="aboutme"){modal={type:"aboutme"};render()}
  else if(a==="addgoal"){modal={type:"goal"};render()}
  else if(a==="canceltimer"){clearInterval(timerState.iv);timerState=null;render()}
  else if(a==="coachnext"){coachRound={i:(coachRound.i+1+Math.floor(Math.random()*(CRITIC.length-1)))%CRITIC.length,picked:null};render()}
  else if(a==="toggleapprove"){S.approve=!S.approve;save();render()}
  else if(a==="addreward"){modal={type:"reward"};render()}
  else if(a==="export"){copyText(JSON.stringify({family:fid,kids:S.kids,rewards:S.rewards}),"Backup copied to clipboard")}
  
}
async function authSubmit(f,d){
  gateErr="";busy=true;render();
  try{
    if(f.dataset.form==="parentlogin"){
      const email=d.email.trim(),pass=d.pass;
      if(f.dataset.mode==="up")await auth.createUserWithEmailAndPassword(email,pass);else await auth.signInWithEmailAndPassword(email,pass);
      const u=auth.currentUser;modal=null;
      if(fid){const ref=db.doc("families/"+fid);const dd=await ref.get();if(dd.exists&&!(dd.data().parents||[]).includes(u.uid))await ref.update({parents:firebase.firestore.FieldValue.arrayUnion(u.uid)});setPref({kidDevice:false});startSync();tab="parent"}
      else await findFamily(u.uid);
    }
    else if(f.dataset.form==="createfam"){await createFamily(d.name.trim())}
    else if(f.dataset.form==="joinparent"){await joinFamilyAsParent(d.code.trim().toUpperCase())}
    else if(f.dataset.form==="kidjoin"){await joinFamilyAsKid(d.code.trim().toUpperCase())}
  }catch(e){gateErr=friendly(e);if(modal&&modal.type==="parentlogin")modal.err=gateErr}
  busy=false;render();
}
function friendly(e){const c=e.code||"";if(c.includes("wrong-password")||c.includes("invalid-credential"))return "Wrong email or password.";if(c.includes("email-already-in-use"))return "That email already has an account. Use Sign in.";if(c.includes("weak-password"))return "Password needs at least 6 characters.";if(c.includes("invalid-email"))return "That email doesn't look right.";if(c.includes("permission-denied"))return "Not allowed. Check the family code.";return e.message||String(e)}
function submit(f){
  const d=Object.fromEntries(new FormData(f).entries());
  if(["parentlogin","createfam","joinparent","kidjoin"].includes(f.dataset.form)){authSubmit(f,d);return}
  const k=K(),t=today();
  if(f.dataset.form==="journal"){const first=!k.journal[t];k.journal[t]={tried:d.tried.trim(),felt:d.felt.trim(),coach:d.coach.trim(),learned:d.learned.trim()};save();if(first){addXP(XP.journal,"Brave Book entry");setTimeout(()=>addCoins(COINS.journal,"Brave Book"),1200)}else toast("Updated");render()}
  else if(f.dataset.form==="goal"){const steps=d.steps.split("\n").map(x=>x.replace(/^\s*(step\s*)?\d+\s*[:.)-]\s*/i,"").trim()).filter(Boolean);if(!steps.length){toast("Add at least one step");return}k.goals=k.goals||[];k.goals.unshift({id:uid(),title:d.title.trim(),why:(d.why||"").trim(),due:d.due||null,steps:steps.map(t=>({t,done:false})),done:false,created:t,checkins:[]});save();modal=null;addXP(XP.goalset,"new goal");setTimeout(()=>addCoins(COINS.goalset,"for setting a goal"),1200);render()}
  else if(f.dataset.form==="addstep"){const g=k.goals.find(x=>x.id===modal.gid);if(g&&d.text.trim()){g.steps.push({t:d.text.trim(),done:false});save()}modal=null;render()}
  else if(f.dataset.form==="checkin"){const g=k.goals.find(x=>x.id===modal.gid);if(g){g.checkins=g.checkins||[];g.checkins.push({week:weekStart(),date:t,rating:d.rating||"Made progress",pct:goalPct(g),note:(d.note||"").trim(),next:(d.next||"").trim()});if(d.next&&d.next.trim()&&!g.steps.some(x=>x.t.toLowerCase()===d.next.trim().toLowerCase()))g.steps.push({t:d.next.trim(),done:false});save();addXP(XP.checkinGoal,"weekly check-in")}modal=null;render()}
  else if(f.dataset.form==="aboutme"){const first=!k.profile;const pr={updated:t};QBANK.filter(q=>q.id).forEach(q=>{const v=d[q.id]||"";pr[q.id]=q.type==="multi"?v.split("|").filter(Boolean):v.trim()});k.profile=pr;save();modal=null;if(first)addXP(XP.aboutme,"About Me done");else toast("Updated");render()}
  else if(f.dataset.form==="win"){k.wins=k.wins||[];k.wins.push({id:uid(),date:t,cat:d.cat,text:d.text.trim(),who:(d.who||"").trim(),status:"pending",coins:0});save();addXP(COINS.winXP,"posted a win");document.querySelector(".main").scrollTop=0;render()}
  else if(f.dataset.form==="chore"){const kk=ensureKid(modal.kid);kk.chores.push({id:uid(),name:d.name.trim(),pts:Math.max(1,parseInt(d.pts)||1),freq:d.freq,day:+d.day});save();modal=null;render()}
  else if(f.dataset.form==="reward"){S.rewards.push({id:uid(),name:d.name.trim(),cost:Math.max(1,parseInt(d.cost)||1)});save();modal=null;render()}
  else if(f.dataset.form==="habit"){if(modal.habit&&modal.habit.id){Object.assign(modal.habit,{name:d.name.trim(),cue:d.cue.trim(),identity:d.identity.trim()})}else k.habits.push({id:uid(),name:d.name.trim(),cue:d.cue.trim(),identity:d.identity.trim(),done:[]});save();modal=null;render()}

}
function pinPress(p){
  if(p==="back")pinBuf=pinBuf.slice(0,-1);else if(p==="clear")pinBuf="";else if(pinBuf.length<4)pinBuf+=p;
  if(pinBuf.length===4){
    if(pinMode==="set"){modal.first=pinBuf;pinMode="confirm";pinBuf="";}
    else if(pinMode==="confirm"){if(pinBuf===modal.first){S.pin=pinBuf;save();parentUnlocked=true;modal=null;tab="parent";toast("PIN set")}else{pinMode="set";pinBuf="";toast("Didn't match. Try again.")}}
    else{if(pinBuf===S.pin){parentUnlocked=true;modal=null;tab="parent"}else{pinBuf="";toast("Nope.")}}
  }
  render();
}
function startTimer(min,label){
  if(timerState)clearInterval(timerState.iv);
  timerState={min,label,end:Date.now()+min*60000};
  timerState.iv=setInterval(()=>{if(Date.now()>=timerState.end){clearInterval(timerState.iv);const k=K();k.sprints.push({d:today(),min,label});save();timerState=null;addXP(XP.sprint,min+" min focus sprint");setTimeout(()=>addCoins(COINS.sprint,"focus sprint"),1200);render();return}const card=document.getElementById("timercard");if(card&&tab==="missions"){const left=Math.max(0,timerState.end-Date.now());const tt=card.querySelector(".timer");if(tt)tt.textContent=Math.floor(left/60000)+":"+String(Math.floor(left%60000/1000)).padStart(2,"0");const arc=card.querySelectorAll("circle")[1];if(arc){const c=2*Math.PI*86;arc.setAttribute("stroke-dashoffset",c*(left/(timerState.min*60000)))}}},1000);
  render();
}
function game(g){
  if(g==="emotion"){gameState.emotion=EMOTIONS[Math.floor(Math.random()*EMOTIONS.length)];render()}
  else if(g==="prompt"){gameState.prompt=EQ_PROMPTS[Math.floor(Math.random()*EQ_PROMPTS.length)];render()}
  else if(g==="cape"){if(gameState.capeRunning)return;gameState.capeRunning=true;gameState.cape=60;render();const iv=setInterval(()=>{gameState.cape--;const el=app.querySelector("[data-game=cape]");if(el){el.previousElementSibling.textContent=gameState.cape}if(gameState.cape<=0){clearInterval(iv);gameState.capeRunning=false;gameState.cape=null;addXP(XP.game,"Superhero cape");render()}},1000)}
  else{const k=K();k.games=k.games||[];k.games.push({d:today(),g});save();addXP(XP.game,"game played")}
}
function summary(id){
  const k=ensureKid(id),kid=KIDS[id];const days=[6,5,4,3,2,1,0].map(i=>daysAgo(i));
  let out=kid.name+" — week of "+days[0]+"\nLevel "+levelOf(k.xp).n+" "+levelOf(k.xp).name+" · "+k.xp+" XP\n\n";
  days.forEach(d=>{const c=k.checkins[d]||{},j=k.journal[d];const hd=k.habits.filter(h=>h.done.includes(d)).length;out+=d.slice(5)+": "+(c.weather?WX[c.weather].l:"—")+" · temp "+(c.temp||"—")+" · habits "+hd+"/"+k.habits.length+(j?"\n   tried: "+j.tried+(j.coach?" | coach: "+j.coach:""):"")+"\n"});
  const tw=(k.wins||[]).filter(w=>days.includes(w.date));if(tw.length)out+="Wins: "+tw.map(w=>w.cat+": "+w.text).join(" | ")+"\n";
  out+="Coins: "+(k.coins||0)+" · pending approvals: "+pendingCount(k)+"\n";
  const og=(k.goals||[]).filter(g=>!g.done);if(og.length)out+="\nGoals: "+og.map(g=>(g.title||g.specific)+" ("+goalPct(g)+"%"+(nextStep(g)?", next: "+nextStep(g).t:"")+")").join("; ")+"\n";
  if(k.echoes[weekKey()])out+="\nParent echo: "+k.echoes[weekKey()];
  return out;
}
function copyText(txt,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast(msg)).catch(()=>fallbackCopy(txt,msg))}else fallbackCopy(txt,msg);
}
function fallbackCopy(txt,msg){const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.top="-1000px";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(msg)}catch(e){toast("Select and copy the text")}document.body.removeChild(ta)}

render();
})();
</script>
